[package]
name = "fugue-sleigh"
version = "0.3.0"
authors = ["Sam Thomas <st@xv.ax>"]
edition = "2021"
license = "MIT"
description = "A binary analysis framework written in Rust"
homepage = "https://fugue.re"

[dependencies]
arrayvec = "0.7"
fugue-lifter = { path = "../fugue-lifter", version = "0.3" }
itertools = "0.13"
once_cell = "1"
pest = "2.6"
pest_derive = "2.6"
smallvec = "1.11"
thiserror = "1"
ustr = "1"
