[package]
name = "fugue-sleigh"
version = "0.3.0"
authors = ["Sam Thomas <st@xv.ax>"]
edition = "2021"
license = "MIT"
description = "A binary analysis framework written in Rust"
homepage = "https://fugue.re"

[dependencies]
arrayvec = "0.7"
fugue-lifter = { path = "../fugue-lifter", version = "0.3" }
itertools = "0.14"
once_cell = "1"
pest = "2.7"
pest_derive = "2.7"
smallvec = "1.13"
thiserror = "2"
ustr = "1"

#[dev-dependencies]
#fugue-lifter-x86le64 = { path = "../../fugue-lifter-x86le64" }
